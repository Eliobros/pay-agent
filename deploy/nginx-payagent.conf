# PayAgent backend — reverse proxy to uvicorn on 127.0.0.1:3004.
# HTTPS is added automatically by: certbot --nginx -d payagent.eliobrostech.site
server {
    listen 80;
    server_name payagent.eliobrostech.site;

    # Evidence uploads allow up to MAX_EVIDENCE_MB (default 15 MB)
    client_max_body_size 20m;

    # Chat answers may take a while (up to 5 model round-trips)
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
